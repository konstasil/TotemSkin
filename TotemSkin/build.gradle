plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.91'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = "Shedaniel"
        url = "https://maven.shedaniel.me/"
    }
}

dependencies {
    // NeoForge
    implementation "net.neoforged:neoforge:${project.neo_version}"

    // Cloth Config (NeoForge)
    implementation "me.shedaniel.cloth:cloth-config-neoforge:${project.cloth_config_version}"
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${project.mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Mojang ships Java 21+ to end users, this mod targets Java 25
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

processResources {
    inputs.properties project.properties
    filesMatching("META-INF/neoforge.mods.toml") {
        expand project.properties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
